name: macOS Tailscale + Display (RustDesk)

on:
  workflow_dispatch:

jobs:
  macos-env:
    runs-on: macos-latest
    timeout-minutes: 360
    steps:
      - name: Setup Tailscale, Virtual Display & RustDesk
        env:
          TS_AUTHKEY: ${{ secrets.TS_AUTHKEY }}
          MAC_PASS: ${{ secrets.RDP_PASSWORD }}
        run: |
          # 1. Install & Jalankan Tailscale
          brew install tailscale
          sudo brew services start tailscale
          sleep 5
          sudo tailscale up --authkey="$TS_AUTHKEY" --hostname="gh-macos-$(jot -r 1 1000 9999)"
          sleep 3
          TS_IP=$(tailscale ip -4)

          # 2. Aktifkan SSH sebagai akses utama/cadangan
          sudo sysadminctl -addUser administrator1 -fullName "Admin" -password "$MAC_PASS" -admin
          sudo systemsetup -setremotelogin on

          # 3. Install Virtual Display (DeskPad) & RustDesk + Lepas Segel Gatekeeper
          brew install --cask deskpad rustdesk
          sudo xattr -cr /Applications/DeskPad.app /Applications/RustDesk.app

          # 4. Jalankan di background agar tidak memblokir terminal
          nohup caffeinate -d -i -m -u >/dev/null 2>&1 &
          open /Applications/DeskPad.app || true
          sleep 2

          sudo nohup /Applications/RustDesk.app/Contents/MacOS/RustDesk --service >/dev/null 2>&1 &
          sleep 3
          sudo /Applications/RustDesk.app/Contents/MacOS/RustDesk --password "$MAC_PASS" >/dev/null 2>&1 || true
          open /Applications/RustDesk.app || true
          sleep 3

          RD_ID=$(/Applications/RustDesk.app/Contents/MacOS/RustDesk --get-id 2>/dev/null || echo "Pakai IP Tailscale")

          echo "========================================"
          echo "MACOS DISPLAY AKTIF!"
          echo "IP Tailscale (Direct IP) : $TS_IP"
          echo "RustDesk ID              : $RD_ID"
          echo "Password                 : (sesuai secret RDP_PASSWORD)"
          echo "========================================"

          # Tahan sesi aktif hingga mendekati batas 6 jam
          sleep 21300
          sudo tailscale logout
